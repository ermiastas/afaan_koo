name: afaan_koo_app
description: AfaanKoo is an educational platform designed to help children learn Afaan Oromoo through interactive lessons, games, stories, coloring, audio, and other engaging activities. The project has been developed by Raji Ermias with the support and technical contribution of his father, Ermias. After more than one year of development, AfaanKoo continues to grow and remains under active construction, requiring further dedication, testing, educational content, and technical development.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Animations
  confetti: ^0.8.0

  # Local Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  screenshot: ^3.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  xml: ^6.5.0

  # Audio
  audioplayers: ^6.1.0
  just_audio: ^0.9.36
  video_player: ^2.14.0
  dio: ^5.8.0+1
  permission_handler: ^12.0.0

  chewie: ^1.8.5

  # Open-source backend: auth, PostgreSQL database, and media storage
  supabase_flutter: ^2.0.0

  # Utilities
  logger: ^2.4.0
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  rename_app: ^1.6.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/splash.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf

  assets:
    # Images
    - assets/images/
    - assets/images/alphabet/
    - assets/images/animals/
    - assets/images/words/
    - assets/images/colors/
    - assets/images/numbers/
    - assets/images/stories/
    - assets/images/songs/
    - assets/images/kooree/
    - assets/images/examples/
    - assets/images/fruits/
    - assets/images/shapes/
    - assets/images/vegetables/
    - assets/images/food/
    - assets/images/cards/
    - assets/images/badges/
    - assets/images/days/
    - assets/images/directions/
    - assets/images/environment/
    - assets/images/family/
    - assets/coloring/
    - assets/audio/raji/
    - assets/coloring_svg/
    - assets/images/home/
    - assets/images/hygiene/
    - assets/images/mammaaksa/
    - assets/images/manners/
    - assets/images/market/
    - assets/images/money/
    - assets/images/months/
    - assets/images/occupation/
    - assets/images/oromo_culture/
    - assets/images/plants/
    - assets/images/school/
    - assets/images/school_supplies/
    - assets/images/time/
    - assets/images/traffic/
    - assets/images/transport/
    - assets/images/values/
    - assets/images/weather/
