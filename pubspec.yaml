name: afaan_koo_app

description: An Afaan Oromo educational learning app for children.

publish_to: "none"

version: 1.0.0+1


environment:
  sdk: ">=3.6.0 <4.0.0"



dependencies:

  flutter:
    sdk: flutter


  # iOS style icons
  cupertino_icons: ^1.0.8


  # State management
  provider: ^6.1.2


  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4


  # Audio playback
  audioplayers: ^6.1.0
  just_audio: ^0.9.36


  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.1.0


  # Logging
  logger: ^2.4.0


  # Admin media picker
  image_picker: ^1.1.2
  file_picker: ^8.0.7



dev_dependencies:

  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0




flutter:

  uses-material-design: true


  assets:


    # General images
    - assets/images/


    # Mascot
    - assets/images/kooree/


    # Learning images
    - assets/images/animals/
    - assets/images/alphabet/
    - assets/images/words/
    - assets/images/colors/
    - assets/images/numbers/
    - assets/images/stories/
    - assets/images/songs/


    # General audio
    - assets/audio/


    # Learning audio
    - assets/audio/animals/
    - assets/audio/alphabet/
    - assets/audio/words/
    - assets/audio/colors/
    - assets/audio/numbers/
    - assets/audio/stories/
    - assets/audio/songs/
    - assets/audio/kooree/


    # JSON content

    - lib/content/animals/animals.json
    - lib/content/alphabet/letters.json
    - lib/content/words/words.json
    - lib/content/colors/colors.json
    - lib/content/numbers/numbers.json
    - lib/content/stories/stories.json
    - lib/content/songs/songs.json
    - lib/content/quizzes/quizzes.json
    - lib/content/kooree/messages.json